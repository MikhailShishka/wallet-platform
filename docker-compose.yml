version: '3.8'

# Общая инфраструктура для wallet-platform:
# - wallet-service БД (Postgres)
# - Redis кэш
# - history-service БД (MongoDB)
# - Kafka + Zookeeper для событий между сервисами

services:
  # ===== wallet-service store =====
  postgres:
    image: postgres:15-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== wallet-service cache =====
  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ===== history-service store =====
  mongo:
    image: mongo:7
    container_name: wallet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s

  # ===== Kafka + Zookeeper =====
  # Используем Bitnami-образы (проще, чем Confluent) и старую модель с ZooKeeper.
  # На проде сейчас чаще уходят на KRaft, но для учебного проекта ZK нагляднее.
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: wallet-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    container_name: wallet-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: PLAINTEXT для внутри compose, PLAINTEXT_HOST для доступа с хоста
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Автосоздание топиков — для dev удобно. В проде отключают.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"    # для приложений на хосте (Spring Boot из IDE)
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===== Jaeger (all-in-one для dev) =====
  # Принимает OTLP gRPC на 4317 и OTLP HTTP на 4318.
  # UI на 16686 — там смотрим trace waterfall.
  # In-memory storage — данные пропадают при перезапуске (для prod надо Elasticsearch/Cassandra).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: wallet-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver

  # ===== Kafka UI (опционально, но очень полезно для дебага) =====
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wallet-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # =====================================================================
  # ================== ПРИЛОЖЕНИЯ (наши сервисы) ========================
  # =====================================================================
  # Собираются локально из Dockerfile каждого сервиса (multi-stage build).
  # depends_on с condition=service_healthy — ждём готовности инфры.

  # ===== wallet-service (MVC + Postgres + Redis + Kafka + Resilience4j) =====
  wallet-service:
    build:
      context: ./wallet-service
      dockerfile: Dockerfile
    container_name: wallet-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      # Подключение к инфре — по именам сервисов внутри compose network
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # URL exchange-rate внутри compose network
      EXCHANGE_RATE_URL: http://exchange-rate-service:8082
      # JVM-настройки для контейнера
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ===== history-service (MVC + MongoDB + Kafka Consumer) =====
  history-service:
    build:
      context: ./history-service
      dockerfile: Dockerfile
    container_name: history-service
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/wallet_history
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8081:8081"
    restart: unless-stopped

  # ===== exchange-rate-service (WebFlux + Reactive Mongo + SSE) =====
  exchange-rate-service:
    build:
      context: ./exchange-rate-service
      dockerfile: Dockerfile
    container_name: exchange-rate-service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/exchange_rates
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8082:8082"
    restart: unless-stopped

  # ===== api-gateway (Spring Cloud Gateway на WebFlux) =====
  # Единая точка входа. В prod это то, что торчит наружу.
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      # Gateway можно поднимать без ожидания всех бэкендов — он им проксирует по мере необходимости
      wallet-service:
        condition: service_started
      history-service:
        condition: service_started
      exchange-rate-service:
        condition: service_started
    environment:
      # URL сервисов внутри compose network
      WALLET_SERVICE_URL: http://wallet-service:8080
      HISTORY_SERVICE_URL: http://history-service:8081
      EXCHANGE_RATE_SERVICE_URL: http://exchange-rate-service:8082
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongo_data:
