spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Глобальные правила: логирование, тайм-ауты
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

      # Маршруты. Каждый = «предикат (когда матчит) + фильтры + куда прокси»
      routes:
        # ===== wallet-service =====
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/wallets/**
          filters:
            # AddRequestHeader — сквозной trace-id для дебага
            - AddRequestHeader=X-Request-Id, ${T(java.util.UUID).randomUUID().toString()}

        # ===== history-service =====
        - id: history-service
          uri: ${HISTORY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/history/**
          filters:
            - AddRequestHeader=X-Request-Id, ${T(java.util.UUID).randomUUID().toString()}

        # ===== exchange-rate-service =====
        - id: exchange-rate-service
          uri: ${EXCHANGE_RATE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/rates/**
          filters:
            - AddRequestHeader=X-Request-Id, ${T(java.util.UUID).randomUUID().toString()}

      # CORS для веб-клиентов, единая политика вместо настройки в каждом сервисе
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"   # dev-фронтенд
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

# JWT (тот же секрет что в wallet-service — общий для аутентификации)
jwt:
  secret: ${JWT_SECRET:dev-secret-must-be-at-least-32-bytes-long-CHANGE-IN-PROD}

# Пути, которые не требуют JWT (регистрация, логин, документация)
security:
  public-paths:
    - /api/v1/auth/**
    - /api/v1/users/register
    - /actuator/**

server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.wallet.gateway: DEBUG
