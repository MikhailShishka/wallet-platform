# ============================================================
# Namespace — логическое разделение платформы от других приложений
# в кластере. Позволяет:
#   - применять квоты ресурсов на всю платформу
#   - настраивать RBAC отдельно
#   - иметь короткие DNS-имена внутри namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: wallet-platform
  labels:
    name: wallet-platform
    env: dev
