# ============================================================
# history-service — MVC + MongoDB + Kafka Consumer.
# Read side CQRS-паттерна.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: history-service-config
  namespace: wallet-platform
data:
  SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/wallet_history"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  OTEL_SERVICE_NAME: "history-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_SAMPLER: "always_on"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-service
  namespace: wallet-platform
  labels:
    app: history-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: history-service
  template:
    metadata:
      labels:
        app: history-service
    spec:
      containers:
        - name: history-service
          image: history-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: history-service-config
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: history-service
  namespace: wallet-platform
spec:
  selector:
    app: history-service
  ports:
    - port: 8081
      targetPort: 8081
