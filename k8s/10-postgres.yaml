# ============================================================
# PostgreSQL — StatefulSet, потому что нужно persistent storage
# и стабильное сетевое имя.
#
# Использование:
#   - wallet-service подключается на postgres.wallet-platform.svc.cluster.local:5432
#   - или короткое имя `postgres` внутри namespace
# ============================================================

# --- Secret с паролем БД ---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: wallet-platform
type: Opaque
stringData:
  POSTGRES_DB: wallet
  POSTGRES_USER: wallet
  POSTGRES_PASSWORD: secret

---
# --- Headless Service (для StatefulSet) ---
# clusterIP: None → DNS-запись указывает напрямую на Pod, без балансировки
# Нужно для StatefulSet, где важно обращение к конкретному Pod'у по имени
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wallet-platform
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres

---
# --- StatefulSet ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: wallet-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secrets
          # Куда монтировать persistent storage
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # Ресурсы: request = минимум для scheduler, limit = максимум (cgroups)
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Liveness — жив ли Postgres
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "wallet"]
            initialDelaySeconds: 30
            periodSeconds: 10
          # Readiness — готов ли принимать соединения
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wallet"]
            initialDelaySeconds: 5
            periodSeconds: 5
  # PersistentVolumeClaim шаблон — K8s создаст PVC для каждого Pod'а
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
