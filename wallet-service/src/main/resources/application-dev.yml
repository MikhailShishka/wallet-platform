# ----- Development profile -----
# Больше логов, все actuator-endpoint'ы открыты, видно SQL.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"                # в dev светим всё для отладки
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.wallet: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # параметры запросов видно
