# ============================================================
# CI Workflow — запускается на PR в main и push в main.
#
# Что делает:
# 1. Build + test всех 4 сервисов параллельно (matrix strategy).
# 2. Static analysis (SpotBugs через Maven).
# 3. Dependency vulnerability scan (OWASP Dependency Check).
# 4. Отдельный job для code coverage (JaCoCo).
#
# Fail-fast: если сборка одного сервиса упала — весь workflow красный.
# ============================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Прервать предыдущие запуски при новом push в тот же PR/ветку
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # Job 1: Build & Test всех сервисов параллельно
  # ==========================================================
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest

    # Matrix strategy — 4 параллельных запуска, по одному на сервис
    strategy:
      fail-fast: false   # если один упал, остальные всё равно доработают
      matrix:
        service:
          - wallet-service
          - history-service
          - exchange-rate-service
          - api-gateway

    steps:
      # 1. Клонируем код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'   # кэш Maven ~/.m2/repository — быстрее сборка

      # 3. Компиляция + тесты + package
      # -B — batch mode (без интерактивных вопросов)
      # -Pci — активирует профиль ci, если есть в pom.xml
      - name: Build & Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn -B verify

      # 4. Загружаем результаты тестов как артефакт
      # Полезно для дебага упавших тестов
      - name: Upload test results
        if: always()   # даже при упавшем предыдущем шаге
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  # ==========================================================
  # Job 2: Security scan — только один запуск на весь репо
  # ==========================================================
  security-scan:
    name: Security scan (dependencies)
    runs-on: ubuntu-latest
    # Не блокируем CI на security-скане (informational)
    # В prod можно поставить continue-on-error: false
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # OWASP Dependency Check — сканирует зависимости на CVE
      # В реальности это часто выносят в отдельный workflow на cron
      # (полный скан занимает 5-10 минут)
      - name: Run OWASP Dependency Check
        working-directory: ./wallet-service
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8
        # failBuildOnCVSS=8 — упасть только на HIGH+CRITICAL

  # ==========================================================
  # Job 3: Итоговый статус — единая точка для branch protection
  # ==========================================================
  # Это удобно для настройки required checks — можно указать один
  # job "ci-success" вместо перечисления всех предыдущих.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build-and-test]   # security-scan не требуем (continue-on-error)
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build & test failed"
            exit 1
          fi
          echo "All checks passed"
